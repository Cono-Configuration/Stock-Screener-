<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Stock Screener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stock Watchlist</h1>
            <p>Search for a company to track its live price</p>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search Company (e.g., Apple)">
                <button id="search-btn" class="btn">Search</button>
            </div>
            
            <!-- Search Results will appear here -->
            <div id="search-results" class="search-results hidden">
                <h3>Search Results</h3>
                <ul id="results-list"></ul>
            </div>
        </header>

        <h2>My Watchlist</h2>
        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Current Price</th>
                    <th>Change</th>
                    <th>Change %</th>
                    <th>Watchlist</th>
                </tr>
            </thead>
            <tbody id="watchlist-table-body">
                <tr><td colspan="5" class="loading">Your watchlist is empty. Search above to add stocks!</td></tr>
            </tbody>
        </table>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
